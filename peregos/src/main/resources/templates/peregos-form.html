<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Peregos Support System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
    </style>
</head>

<body class="bg-light">
    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="text-center">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <h4 class="mt-3">Requesting Student Data...</h4>
            <p id="statusMessage" class="text-muted">This might take a moment if services are starting up.</p>
            <div class="progress mt-3" style="width: 200px">
                <div class="progress-bar progress-bar-striped progress-bar-animated" style="width: 100%"></div>
            </div>
            <button class="btn btn-secondary mt-3" onclick="cancelRequest()">Cancel Request</button>
        </div>
    </div>

    <div class="container mt-5">
        <!-- Step 1: Student ID Input -->
        <div id="step1" class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body">
                        <h2 class="card-title text-center mb-4">Enter Student ID</h2>
                        <form id="studentIdForm">
                            <div class="mb-3">
                                <input type="number" class="form-control" id="studentId" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Continue</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Step 2: Display Student Info & Program Selection -->
        <div id="step2" class="row justify-content-center d-none">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-body">
                        <h2 class="card-title mb-4">Select Study Program</h2>
                        <div class="student-info mb-4">
                            <h4>Student Information</h4>
                            <p><strong>Name:</strong> <span id="studentName"></span></p>
                            <p><strong>Student ID:</strong> <span id="displayStudentId"></span></p>
                        </div>
                        <div class="program-selection">
                            <h4>Available Programs</h4>
                            <div id="programList" class="list-group mb-3">
                                <!-- Programs will be inserted here -->
                            </div>
                            <button onclick="proceedToStep3()" class="btn btn-primary">Continue</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Step 3: Help Request Form -->
        <div id="step3" class="row justify-content-center d-none">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-body">
                        <h2 class="card-title mb-4">Submit Help Request</h2>
                        <form id="helpRequestForm">
                            <div class="mb-3">
                                <label class="form-label">Selected Program</label>
                                <input type="text" id="selectedProgram" class="form-control" readonly>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Request Details</label>
                                <textarea class="form-control" rows="5" required></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary">Submit Request</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentStudent = null; // Store student data globally
        let requestInProgress = false;
        let requestCancelled = false;

        document.getElementById('studentIdForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const studentId = document.getElementById('studentId').value;
            handleStudentRequest(studentId);
        });

        async function handleStudentRequest(studentId) {
            requestInProgress = true;
            requestCancelled = false;
            showLoading(true);
            updateStatus('Requesting student data...');

            while (requestInProgress && !requestCancelled) {
                try {
                    const response = await fetch(`/peregos/student/${studentId}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        }
                    });

                    if (requestCancelled) {
                        showLoading(false);
                        return;
                    }

                    if (response.ok) {
                        const data = await response.json();
                        if (data) {
                            requestInProgress = false;
                            showLoading(false);
                            displayStudentInfo(data);
                            showStep(2);
                            return;
                        }
                    }

                    updateStatus(`Waiting for response... (${new Date().toLocaleTimeString()})`);
                    await new Promise(resolve => setTimeout(resolve, 5000));

                } catch (error) {
                    updateStatus(`Error: ${error.message} - Retrying...`);
                    await new Promise(resolve => setTimeout(resolve, 5000));
                }
            }
        }

        function showLoading(show) {
            document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none';
        }

        function updateStatus(message) {
            document.getElementById('statusMessage').textContent = message;
        }

        function cancelRequest() {
            requestCancelled = true;
            requestInProgress = false;
            showLoading(false);
            showStep(1);
        }

        function displayStudentInfo(student) {
            // Store the student data globally
            currentStudent = student;  // Add this line

            document.getElementById('studentName').textContent =
                `${student.firstName} ${student.lastName}`;
            document.getElementById('displayStudentId').textContent = student.studentId;

            const programList = document.getElementById('programList');
            programList.innerHTML = '';

            student.studyPrograms.forEach(program => {
                const button = document.createElement('button');
                button.className = 'list-group-item list-group-item-action';
                button.textContent = program.programName;
                button.onclick = () => selectProgram(program.programName);
                programList.appendChild(button);
            });
        }

        function selectProgram(programName) {
            document.getElementById('selectedProgram').value = programName;
        }

        function proceedToStep3() {
            if (!document.getElementById('selectedProgram').value) {
                alert('Please select a study program first');
                return;
            }
            showStep(3);
        }

        // Add help request form submission handler
        document.getElementById('helpRequestForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const requestDetails = e.target.querySelector('textarea').value;
            const selectedProgram = document.getElementById('selectedProgram').value;

            try {
                const response = await fetch('/peregos/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        studentId: currentStudent.studentId,
                        programName: selectedProgram,
                        requestDetails: requestDetails
                    })
                });

                if (!response.ok) {
                    throw new Error('Failed to submit request');
                }

                alert('Help request submitted successfully!');
                window.location.reload(); // Reset form
            } catch (error) {
                alert('Error submitting request: ' + error.message);
            }
        });

        function showStep(step) {
            document.querySelectorAll('[id^="step"]').forEach(el => {
                el.classList.add('d-none');
            });
            document.getElementById(`step${step}`).classList.remove('d-none');
        }
    </script>
</body>

</html>
