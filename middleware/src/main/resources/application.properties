server.port=8083
spring.application.name=middleware
logging.level.edu.fra.uas.middleware=DEBUG
logging.level.org.springframework.amqp=DEBUG

# RabbitMQ settings
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
# More aggressive retry for middleware
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=2000
spring.rabbitmq.listener.simple.retry.max-attempts=5
spring.rabbitmq.listener.simple.retry.multiplier=1.5
# Keep messages in queue if HIS is down
spring.rabbitmq.listener.simple.default-requeue-rejected=true
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1
