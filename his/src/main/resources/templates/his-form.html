<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>HIS - Student Information System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .step {
            display: none;
        }

        .step.active {
            display: block;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
    </style>
</head>

<body class="bg-light">
    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="text-center">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <h4 class="mt-3">Authenticating...</h4>
            <p id="statusMessage" class="text-muted"></p>
        </div>
    </div>

    <div class="container mt-5">
        <!-- Step 1: Login -->
        <div id="step1" class="step active">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card shadow">
                        <div class="card-body">
                            <h2 class="card-title text-center mb-4">HIS Login</h2>
                            <form id="loginForm">
                                <div class="mb-3">
                                    <label for="studentId" class="form-label">Student ID</label>
                                    <input type="number" class="form-control" id="studentId" required>
                                </div>
                                <div class="mb-3">
                                    <label for="password" class="form-label">Password</label>
                                    <input type="password" class="form-control" id="password" required>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">Login</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Step 2: Program Selection -->
        <div id="step2" class="step">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="card shadow">
                        <div class="card-body">
                            <h2 class="card-title mb-4">Welcome <span id="studentName"></span></h2>
                            <div class="mb-4">
                                <h4>Your Study Programs</h4>
                                <div id="programList" class="list-group">
                                    <!-- Programs will be inserted here -->
                                </div>
                            </div>
                            <button class="btn btn-secondary" onclick="logout()">Logout</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Step 3: Program Details -->
        <div id="step3" class="step">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="card shadow">
                        <div class="card-body">
                            <h2 class="card-title mb-4">Program Details</h2>
                            <div id="programDetails">
                                <!-- Program details will be inserted here -->
                            </div>
                            <div class="mt-3">
                                <button class="btn btn-secondary" onclick="showStep(2)">Back</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentStudent = null;

        function showLoading(show, message = '') {
            document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none';
            document.getElementById('statusMessage').textContent = message;
        }

        function showStep(step) {
            document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
            document.getElementById(`step${step}`).classList.add('active');
        }

        async function authenticate(studentId, password) {
            showLoading(true, 'Authenticating...');
            try {
                const response = await fetch('/his/authenticate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ studentId, password })
                });

                if (!response.ok) {
                    throw new Error('Authentication failed');
                }

                const data = await response.json();
                currentStudent = data;
                showLoading(false);
                displayStudentInfo(data);
                showStep(2);
            } catch (error) {
                showLoading(false);
                alert('Invalid credentials. Please try again.');
            }
        }

        function displayStudentInfo(student) {
            document.getElementById('studentName').textContent =
                `${student.firstName} ${student.lastName}`;

            const programList = document.getElementById('programList');
            programList.innerHTML = '';

            student.studyPrograms.forEach(program => {
                const button = document.createElement('button');
                button.className = 'list-group-item list-group-item-action';
                button.innerHTML = `
                    <div class="d-flex w-100 justify-content-between">
                        <h5 class="mb-1">${program.programName}</h5>
                        <small>${program.totalCreditPoints} CP</small>
                    </div>
                    <p class="mb-1">Started: ${program.startingDate}</p>
                `;
                button.onclick = () => showProgramDetails(program);
                programList.appendChild(button);
            });
        }

        function showProgramDetails(program) {
            const details = document.getElementById('programDetails');
            details.innerHTML = `
                <h3>${program.programName}</h3>
                <p>Starting Date: ${program.startingDate}</p>
                <p>Total Credit Points: ${program.totalCreditPoints}</p>
                <h4>Modules:</h4>
                <table class="table">
                    <thead>
                        <tr>
                            <th>Module Name</th>
                            <th>Credit Points</th>
                            <th>Grade</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${program.moduleList.map(module => `
                            <tr>
                                <td>${module.moduleName}</td>
                                <td>${module.cp}</td>
                                <td>${module.grade}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            showStep(3);
        }

        function logout() {
            currentStudent = null;
            document.getElementById('loginForm').reset();
            showStep(1);
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const studentId = document.getElementById('studentId').value;
            const password = document.getElementById('password').value;
            authenticate(studentId, password);
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
